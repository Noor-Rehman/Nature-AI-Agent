name: Daily AI Video Agent

on:
  schedule:
    - cron: '0 9 * * *'  # This runs every day at 9:00 AM UTC
  workflow_dispatch:      # This allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run Video Creator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LEONARDO_COOKIE: ${{ secrets.LEONARDO_COOKIE }} 
        run: python generate_video.py

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Daily AI Video and Log Update"
          git push
