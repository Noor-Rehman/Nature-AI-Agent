name: Daily AI Video Generator

on:
  schedule:
    - cron: '0 9 * * *'   # daily 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Video Generator
        run: python generate_video.py

      - name: Move output with timestamp
        run: |
          mkdir -p videos
          mv output.mp4 videos/output_$(date +%Y%m%d_%H%M%S).mp4

      - name: Commit and push video
        run: |
          git config --global user.name "AI Bot"
          git config --global user.email "bot@github.com"

          git add videos/

          git pull --rebase origin main
          git commit -m "🎬 Daily AI Video" || exit 0
          git push
